 
# LibreChat Configuration
# For more information, see: https://www.librechat.ai/docs/configuration/librechat_yaml

# Configuration version (required)
version: 1.3.1

# Cache settings
cache: true

# Custom interface configuration
interface:
  modelSelect: false
  endpointsMenu: false
  presets: false
  parameters: false

modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: claude-sonnet-4-5      label: Claude Sonnet 4.5      default: true
      preset:
        endpoint: bedrock
        model: 'us.anthropic.claude-sonnet-4-5-20250929-v1:0'

# Actions configuration
actions:
  allowedDomains:
    - 'swapi.dev'
    - 'librechat.ai'
    - 'google.com'

# Endpoints configuration (add your AI endpoints here)
# At least one endpoint key is required, so we add a minimal agents endpoint
endpoints:
  agents:
    # Increase context length for better handling of long conversations and documents
    maxContextTokens: 200000  # Maximum context window (200k tokens for Claude Sonnet 4)
    max_tokens: 200000         # Maximum output tokens per response
    recursionLimit: 50        # Maximum number of tool calls/reasoning steps
    maxRecursionLimit: 100    # Hard limit on recursion

# MCP Servers configuration
mcpServers:

  # Query service (document MCP / RAG SSE) — hosted
  document_search:
    url: http://internal-fia-litellm-internal-alb-1403586785.ap-south-1.elb.amazonaws.com/sse
    timeout: 180000
    serverInstructions: true
    chatMenu: true


