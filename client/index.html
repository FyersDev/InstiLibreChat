<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="theme-color" content="#171717" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="FIA-Fyers Intelligence Assistant - Advanced AI-powered financial intelligence platform" />
    <title>FIA - FYERS Intelligent Assistant</title>
    <link rel="icon" type="image/svg+xml" href="assets/Logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
    </style>
    <script>
      const theme = localStorage.getItem('color-theme');
      const loadingContainerStyle = document.createElement('style');
      let backgroundColor;

      if (theme === 'dark') {
        backgroundColor = '#0d0d0d';
      } else if (theme === 'light') {
        backgroundColor = '#ffffff';
      } else if (theme === 'system') {
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
        backgroundColor = prefersDarkScheme ? '#0d0d0d' : '#ffffff';
      } else {
        backgroundColor = '#ffffff';
      }

      loadingContainerStyle.innerHTML = `
        #loading-container {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: ${backgroundColor};
        }
      `;
      document.head.appendChild(loadingContainerStyle);
    </script>
    <script>
      // Embedded auth: if ?token= is in the URL, call token-exchange to get
      // LibreChat cookies set on this origin, then reload without the param.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var ssoToken = params.get('token');
        if (ssoToken) {
          var maxAge = 7 * 24 * 60 * 60;
          var xhr = new XMLHttpRequest();
          xhr.open('POST', '/auth/token-exchange', false); // synchronous
          xhr.setRequestHeader('Authorization', 'Bearer ' + ssoToken);
          xhr.setRequestHeader('Content-Type', 'application/json');
          try {
            xhr.send();
            if (xhr.status === 200) {
              var d = JSON.parse(xhr.responseText);
              document.cookie = 'refreshToken=' + d.refresh_token + '; path=/; max-age=' + maxAge;
              document.cookie = 'token_provider=proxy; path=/; max-age=' + maxAge;
              document.cookie = 'libre_jwt=' + d.proxy_token + '; path=/; max-age=' + maxAge;
              document.cookie = 'lc_access_token=' + d.access_token + '; path=/; max-age=' + maxAge;
              document.cookie = 'embedded=true; path=/; max-age=' + maxAge;
              document.cookie = 'saas_access_token=' + ssoToken + '; path=/; max-age=' + maxAge;
              localStorage.setItem('access_token', ssoToken);
            }
          } catch (e) {
            console.error('Token exchange failed:', e);
          }
          params.delete('token');
          var clean = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
          window.location.replace(clean);
          return;
        }

        // Normal embedded mode: sync saas-api tokens from cookies to localStorage.
        var cookies = document.cookie.split('; ').reduce(function (acc, c) {
          var parts = c.split('=');
          acc[parts[0]] = decodeURIComponent(parts.slice(1).join('='));
          return acc;
        }, {});
        if (cookies.saas_access_token) {
          localStorage.setItem('access_token', cookies.saas_access_token);
        }
        if (cookies.saas_refresh_token) {
          localStorage.setItem('refresh_token', cookies.saas_refresh_token);
        }
      })();
    </script>
    <script defer type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root">
      <div id="loading-container"></div>
    </div>
  </body>
</html>
