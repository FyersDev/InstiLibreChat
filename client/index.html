    <script>
      (function () {
        try {
          // Skip theme/loader on auth/embed (short-lived or redirecting).
          if ((window.location.pathname || '').indexOf('auth/embed') !== -1) {
            return;
          }
          var p = new URLSearchParams(window.location.search);
          var t = (p.get('theme') || '').toLowerCase();
          if (t === 'light' || t === 'dark') {
            localStorage.setItem('color-theme', t);
            var root = document.documentElement;
            root.classList.remove('dark', 'light');
            root.classList.add(t === 'dark' ? 'dark' : 'light');
          }
        } catch (e) {}
      })();
      const theme = localStorage.getItem('color-theme');
      const loadingContainerStyle = document.createElement('style');
      let backgroundColor;

      if (theme === 'dark') {
        backgroundColor = '#0d0d0d';
      } else if (theme === 'light') {
        backgroundColor = '#ffffff';
      } else if (theme === 'system') {
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
        backgroundColor = prefersDarkScheme ? '#0d0d0d' : '#ffffff';
      } else {
        backgroundColor = '#ffffff';
      }

      loadingContainerStyle.innerHTML = `
        #loading-container {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: ${backgroundColor};
        }
        #loading-container::after {
          content: '';
          width: 120px;
          height: 120px;
          background-image: url('/research/assets/${theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'loader_dark' : 'loader_light'}.gif');
          background-size: contain;
          background-repeat: no-repeat;
          background-position: center;
        }
      `;
      document.head.appendChild(loadingContainerStyle);
    </script>
    <script defer type="module" src="/src/main.jsx"></script>

  <body>
    <div id="root">
      <div id="loading-container"></div>
    </div>
